name = "r2-drive"
main = "src/worker.ts"
compatibility_date = "2026-05-16"

# Bind this Worker to the domain that should host the file explorer.
# For a Cloudflare Worker Custom Domain, uncomment this block and replace
# the pattern with your hostname. Do not include /* with custom_domain = true.
#
# [[routes]]
# pattern = "files.example.com"
# custom_domain = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "your-r2-bucket-name"

[vars]
EXPLORER_TITLE = "R2 Drive"
ALLOW_UPLOADS = "true"
ALLOW_DELETES = "true"

# Optional user protection:
# 1. Set a secret: `npx wrangler secret put AUTH_USERS`
# 2. Paste JSON such as: {"alice":"secret-one","bob":"secret-two"}
# 3. Open the explorer and sign in with a username and token.
#
# For a single shared token, `AUTH_TOKEN` is still supported:
# `npx wrangler secret put AUTH_TOKEN`
